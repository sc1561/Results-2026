<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>لوحة المدير — مدرسة أبو القاسم الزهراوي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080e1a;
  --bg2:#0d1628;
  --card:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.1);
  --gold:#f59e0b;--gold2:#fbbf24;
  --red:#d71920;--green:#0ea85f;
  --blue:#2563eb;--purple:#7c3aed;
  --orange:#f97316;
  --text:#f0f4ff;--muted:rgba(255,255,255,.5);
  --radius:20px;
}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* BG */
.bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.25;animation:orbF 15s ease-in-out infinite;}
.orb1{width:600px;height:600px;background:radial-gradient(circle,#1a4fa0,transparent);top:-200px;right:-150px;}
.orb2{width:500px;height:500px;background:radial-gradient(circle,#d71920,transparent);bottom:-150px;left:-100px;animation-delay:-5s;}
.orb3{width:350px;height:350px;background:radial-gradient(circle,#f59e0b,transparent);top:40%;left:40%;animation-delay:-10s;}
@keyframes orbF{0%,100%{transform:scale(1) translate(0,0);}50%{transform:scale(1.1) translate(20px,-20px);}}

/* ====== LOGIN SCREEN ====== */
#loginScreen{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);
}
.login-box{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.12);
  border-radius:28px;
  padding:40px 32px;
  width:340px;
  text-align:center;
  backdrop-filter:blur(20px);
  box-shadow:0 30px 60px rgba(0,0,0,.5);
  animation:popIn .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
.login-logo{
  width:72px;height:72px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 16px;
  font-size:32px;
  box-shadow:0 8px 24px rgba(245,158,11,.35);
}
.login-box h2{font-size:1.2rem;font-weight:900;margin-bottom:4px;}
.login-box p{font-size:.82rem;color:var(--muted);margin-bottom:28px;}
.pin-input{
  width:100%;height:52px;
  background:rgba(255,255,255,.07);
  border:1.5px solid rgba(255,255,255,.15);
  border-radius:14px;color:#fff;
  text-align:center;font-size:1.4rem;
  font-family:'Tajawal',sans-serif;
  font-weight:900;letter-spacing:6px;
  outline:none;transition:.25s;
  direction:ltr;
}
.pin-input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(245,158,11,.2);}
.btn-login{
  width:100%;height:50px;margin-top:14px;border:0;
  background:linear-gradient(135deg,var(--gold),#d97706);
  color:#1a0a00;font-family:'Tajawal',sans-serif;
  font-weight:900;font-size:1rem;border-radius:14px;
  cursor:pointer;transition:.2s;
}
.btn-login:hover{box-shadow:0 8px 20px rgba(245,158,11,.4);}
.btn-login:active{transform:scale(.98);}
.login-err{color:#fca5a5;font-size:.82rem;font-weight:700;margin-top:10px;display:none;}

/* ====== MAIN LAYOUT ====== */
#mainApp{display:none;}
.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;}

/* HEADER */
header{
  background:linear-gradient(135deg,rgba(215,25,32,.15),rgba(26,79,160,.2));
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:16px 20px;
  display:flex;align-items:center;justify-content:space-between;
}
.header-title{font-size:1.1rem;font-weight:900;}
.header-sub{font-size:.75rem;color:var(--muted);font-weight:600;margin-top:2px;}
.btn-logout{
  background:rgba(215,25,32,.15);border:1px solid rgba(215,25,32,.3);
  color:#fca5a5;font-family:'Tajawal',sans-serif;font-weight:800;font-size:.78rem;
  padding:6px 14px;border-radius:999px;cursor:pointer;transition:.2s;
}
.btn-logout:hover{background:rgba(215,25,32,.3);}

/* CONTROLS PANEL */
.controls{
  background:rgba(255,255,255,.04);
  border-bottom:1px solid var(--border);
  padding:16px 20px;
  display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;
}
.ctrl-group{display:flex;flex-direction:column;gap:6px;min-width:140px;}
.ctrl-group label{font-size:.75rem;font-weight:800;color:var(--muted);}
.ctrl-select, .ctrl-input{
  height:40px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  border-radius:10px;color:#fff;
  font-family:'Tajawal',sans-serif;font-weight:700;font-size:.85rem;
  padding:0 12px;outline:none;cursor:pointer;
  appearance:none;-webkit-appearance:none;
  transition:.2s;
}
.ctrl-select:focus,.ctrl-input:focus{border-color:var(--gold);}
.ctrl-select option{background:#0d1628;color:#fff;}
.btn-generate{
  height:40px;padding:0 22px;border:0;
  background:linear-gradient(135deg,var(--gold),#d97706);
  color:#1a0a00;font-family:'Tajawal',sans-serif;
  font-weight:900;font-size:.9rem;border-radius:10px;
  cursor:pointer;transition:.2s;white-space:nowrap;
}
.btn-generate:hover{box-shadow:0 6px 16px rgba(245,158,11,.4);}

.btn-print{
  height:40px;padding:0 18px;border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.07);
  color:#fff;font-family:'Tajawal',sans-serif;
  font-weight:800;font-size:.85rem;border-radius:10px;
  cursor:pointer;transition:.2s;white-space:nowrap;
}
.btn-print:hover{background:rgba(255,255,255,.12);}

.btn-img{
  height:40px;padding:0 18px;border:0;
  background:linear-gradient(135deg,#25d366,#128c3e);
  color:#fff;font-family:'Tajawal',sans-serif;
  font-weight:800;font-size:.85rem;border-radius:10px;
  cursor:pointer;transition:.2s;white-space:nowrap;
}
.btn-img:hover{box-shadow:0 6px 16px rgba(37,211,102,.35);}

/* RESULTS AREA */
#resultsArea{padding:20px;flex:1;}
.section-title{
  font-size:1rem;font-weight:900;margin-bottom:16px;
  display:flex;align-items:center;gap:8px;
  color:var(--gold2);
}

/* ====== CARD STYLES ====== */
/* Mode: simple (name + rank) */
.cards-grid{display:grid;gap:12px;}
.cards-grid.mode-simple{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}
.cards-grid.mode-medium{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));}
.cards-grid.mode-full{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));}

.honor-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  position:relative;
  overflow:hidden;
  transition:transform .2s;
  animation:slideUp .4s cubic-bezier(.34,1.56,.64,1) both;
}
.honor-card:hover{transform:translateY(-3px);}
.honor-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--card-accent,var(--gold));
}

/* Rank badge inside card */
.card-rank{
  position:absolute;top:12px;left:12px;
  width:36px;height:36px;border-radius:50%;
  background:var(--card-accent,var(--gold));
  display:flex;align-items:center;justify-content:center;
  font-size:.85rem;font-weight:900;
  color:#fff;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}
.card-rank.rank1{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#78350f;}
.card-rank.rank2{background:linear-gradient(135deg,#94a3b8,#cbd5e1);color:#1e293b;}
.card-rank.rank3{background:linear-gradient(135deg,#92400e,#b45309);color:#fef3c7;}

.card-name{
  font-size:.92rem;font-weight:800;
  padding-right:8px;
  line-height:1.4;
  margin-bottom:8px;
  margin-left:44px; /* space for rank badge */
}
.card-class{font-size:.72rem;color:var(--muted);font-weight:700;margin-bottom:10px;margin-left:44px;}

.card-stats{display:flex;flex-wrap:wrap;gap:8px;}
.card-stat{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  border-radius:10px;padding:6px 10px;
  text-align:center;flex:1;min-width:70px;
}
.card-stat-lbl{font-size:.65rem;color:var(--muted);font-weight:700;margin-bottom:2px;}
.card-stat-val{font-size:1rem;font-weight:900;}

/* Podium for top 3 */
.podium-wrap{
  display:flex;align-items:flex-end;justify-content:center;
  gap:16px;margin-bottom:24px;
}
.podium-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px 16px;
  text-align:center;
  position:relative;
  overflow:hidden;
  flex:1;max-width:200px;
  animation:slideUp .5s cubic-bezier(.34,1.56,.64,1) both;
}
.podium-card.p1{
  border-color:rgba(245,158,11,.4);
  background:linear-gradient(160deg,rgba(245,158,11,.1),rgba(245,158,11,.03));
  transform:scale(1.05);
  animation-delay:.1s;
}
.podium-card.p2{animation-delay:.05s;}
.podium-card.p3{animation-delay:.15s;}
.podium-medal{font-size:2rem;margin-bottom:8px;}
.podium-name{font-size:.85rem;font-weight:900;line-height:1.4;margin-bottom:4px;}
.podium-class{font-size:.7rem;color:var(--muted);font-weight:700;margin-bottom:10px;}
.podium-pct{font-size:1.6rem;font-weight:900;color:var(--gold2);}
.podium-total{font-size:.72rem;color:var(--muted);margin-top:2px;}
.podium-base{height:4px;background:var(--card-accent,var(--gold));border-radius:999px;margin-top:12px;}

@keyframes slideUp{from{transform:translateY(25px);opacity:0;}to{transform:translateY(0);opacity:1;}}

/* Empty state */
.empty-state{
  text-align:center;padding:60px 20px;
  color:var(--muted);font-weight:700;font-size:.95rem;
}
.empty-state .icon{font-size:3rem;margin-bottom:12px;}

/* PRINT */
@media print{
  body{background:#fff!important;color:#000!important;}
  .bg-orbs,.controls,header,.btn-print,.btn-img{display:none!important;}
  .honor-card,.podium-card{
    background:#f8f9fa!important;border:1px solid #dee2e6!important;
    break-inside:avoid;
  }
  .card-name,.podium-name,.section-title{color:#000!important;}
  .card-stat-val,.podium-pct{color:#000!important;}
  .card-stat-lbl,.podium-class,.card-class{color:#666!important;}
  #resultsArea{padding:10px!important;}
  .cards-grid{gap:8px!important;}
}

/* FOOTER */
footer{background:rgba(0,0,0,.3);border-top:1px solid var(--border);
  color:var(--muted);text-align:center;padding:12px;font-size:.75rem;}

@media(max-width:600px){
  .controls{flex-direction:column;}
  .ctrl-group{min-width:100%;}
  .podium-wrap{flex-direction:column;align-items:center;}
  .podium-card{max-width:100%;width:100%;}
}
</style>
</head>
<body>

  <div class="ctrl-group">

      <option value="all">جميع المواد</option>
      <option value="core">المواد الأساسية</option>
    </select>
  </div>

  <div class="ctrl-group">
    <label>🔢 عدد الطلاب</label>
    <input type="number" class="ctrl-input" id="ctrlCount"
           value="10" min="1" max="50" style="width:90px">
  </div>

  <div class="ctrl-group">
    <label>🎨 طريقة العرض</label>

      <option value="simple">بسيط (الاسم + المركز)</option>

  <button class="btn-generate" onclick="generate()">⚡ عرض</button>

</div>

<!-- RESULTS -->
<div id="resultsArea">
  <div class="empty-state">
    <div class="icon">🏆</div>
    اختر الإعدادات واضغط <strong>عرض</strong>
  </div>
</div>

<footer>⚡ لوحة تحكم المدير — مدرسة أبو القاسم الزهراوي | برمجة أستاذ أحمد الضامري</footer>

<script>
// ===== AUTH =====
const PIN = '11908823';

function doLogin(){
  const v = document.getElementById('pinInput').value.trim();
  if(v === PIN){
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('mainApp').style.display='block';
    sessionStorage.setItem('admin_ok','1');
  } else {
    const e = document.getElementById('loginErr');
    e.style.display='block';
    document.getElementById('pinInput').value='';
    document.getElementById('pinInput').focus();
    setTimeout(()=>e.style.display='none',3000);
  }
}
function doLogout(){
  sessionStorage.removeItem('admin_ok');
  location.reload();
}
window.addEventListener('load',()=>{
  if(sessionStorage.getItem('admin_ok')==='1'){
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('mainApp').style.display='block';
  } else {
    document.getElementById('pinInput').focus();
  }
});
document.getElementById('pinInput').addEventListener('keypress',e=>{
  if(e.key==='Enter') doLogin();
});

// ===== SCOPE TOGGLE =====
document.getElementById('ctrlScope').addEventListener('change', function(){
  const v = this.value;
  document.getElementById('grpClass').style.display  = v==='class'  ? '' : 'none';
  document.getElementById('grpGrade').style.display  = v==='grade'  ? '' : 'none';
});

// ===== HELPERS =====
const medal = r => r===1?'🥇':r===2?'🥈':r===3?'🥉':`#${r}`;
const rankClass = r => r===1?'rank1':r===2?'rank2':r===3?'rank3':'';
const cardAccent = r => r===1?'#f59e0b':r===2?'#94a3b8':r===3?'#b45309':r<=5?'#2563eb':r<=10?'#7c3aed':'rgba(255,255,255,.2)';

const RANK_NAMES = ['','الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر',
  'الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر','الخامس عشر','السادس عشر','السابع عشر','الثامن عشر','التاسع عشر','العشرون',
  'الواحد والعشرون','الثاني والعشرون','الثالث والعشرون','الرابع والعشرون','الخامس والعشرون',
  'السادس والعشرون','السابع والعشرون','الثامن والعشرون','التاسع والعشرون','الثلاثون',
  'الواحد والثلاثون','الثاني والثلاثون','الثالث والثلاثون','الرابع والثلاثون','الخامس والثلاثون',
  'السادس والثلاثون','السابع والثلاثون','الثامن والثلاثون','التاسع والثلاثون','الأربعون',
  'الواحد والأربعون','الثاني والأربعون','الثالث والأربعون','الرابع والأربعون','الخامس والأربعون',
  'السادس والأربعون','السابع والأربعون','الثامن والأربعون','التاسع والأربعون','الخمسون'];

function rankLabel(rank, isDup){
  const name = RANK_NAMES[rank] || `${rank}`;
  return `المركز ${name}${isDup ? ' مكرر' : ''}`;
}

// Detect duplicates in a sorted list
function markDuplicates(list, rankBy){
  const scoreOf = s => rankBy==='core' ? s.ct : s.t;
  const counts = {};
  list.forEach(s => { const sc = scoreOf(s); counts[sc] = (counts[sc]||0)+1; });
  return list.map(s => ({...s, _isDup: counts[scoreOf(s)] > 1}));
}

function generate(){
  const scope   = document.getElementById('ctrlScope').value;
  const cls     = document.getElementById('ctrlClass').value;
  const grade   = document.getElementById('ctrlGrade').value;
  const rankBy  = document.getElementById('ctrlRankBy').value;
  const count   = Math.min(50, Math.max(1, parseInt(document.getElementById('ctrlCount').value)||10));
  const mode    = document.getElementById('ctrlMode').value;

  // Filter
  let pool = STUDENTS.filter(s => {
    if(scope==='class') return s.cl === cls;
    if(scope==='grade') return s.g  === grade;
    return true;
  });

  // Sort
  if(rankBy==='core') pool.sort((a,b)=>b.ct-a.ct);
  else                pool.sort((a,b)=>b.t -a.t );

  // Take top N and mark duplicates
  const top = markDuplicates(pool.slice(0, count), rankBy);

  // Labels
  const scopeLabel = scope==='class' ? `الصف ${cls}`
                   : scope==='grade' ? `مرحلة ${grade}`
                   : 'المدرسة كاملة';
  const rkLabel = rankBy==='core' ? 'المواد الأساسية' : 'جميع المواد';

  // Render
  const area = document.getElementById('resultsArea');

  let html = `<div class="section-title">🏆 أوائل ${scopeLabel} — ${rkLabel} (أفضل ${count})</div>`;

  // Podium for top 3 (if count >= 3 and mode != simple)
  if(count >= 3 && mode !== 'simple'){
    const podOrder = top.length >= 3 ? [top[1], top[0], top[2]] : top;
    const podClasses = top.length >= 3 ? ['p2','p1','p3'] : ['p1','p2','p3'];
    const podMedals  = top.length >= 3 ? ['🥈','🥇','🥉'] : ['🥇','🥈','🥉'];
    const podAccents = top.length >= 3 ? ['#94a3b8','#f59e0b','#b45309'] : ['#f59e0b','#94a3b8','#b45309'];
    const podRanks   = top.length >= 3 ? [2, 1, 3] : [1, 2, 3];

    html += `<div class="podium-wrap">`;
    podOrder.forEach((s,i)=>{
      if(!s) return;
      const pct  = rankBy==='core' ? s.cp : s.p;
      const tot  = rankBy==='core' ? `${s.ct}/${s.cm}` : `${s.t}/${s.mt}`;
      const rank = podRanks[i];
      const rl   = rankLabel(rank, s._isDup);
      html += `<div class="podium-card ${podClasses[i]}" style="--card-accent:${podAccents[i]}">
        <div class="podium-medal">${podMedals[i]}</div>
        <div class="podium-rank-lbl" style="font-size:.72rem;font-weight:900;color:${podAccents[i]};margin-bottom:4px;">${rl}</div>
        <div class="podium-name">${s.n}</div>
        <div class="podium-class">${s.cl} • ${s.g}</div>
        <div class="podium-pct">${pct}%</div>
        <div class="podium-total">${tot} درجة</div>
        <div class="podium-base"></div>
      </div>`;
    });
    html += `</div>`;

    // Remaining after podium
    const rest = top.slice(3);
    if(rest.length > 0){
      html += `<div class="cards-grid mode-${mode}">`;
      rest.forEach((s,i)=>{
        html += buildCard(s, i+4, mode, rankBy, cardAccent(i+4));
      });
      html += `</div>`;
    }
  } else {
    // All as cards
    html += `<div class="cards-grid mode-${mode}">`;
    top.forEach((s,i)=>{
      html += buildCard(s, i+1, mode, rankBy, cardAccent(i+1));
    });
    html += `</div>`;
  }

  area.innerHTML = html;
}

function buildCard(s, rank, mode, rankBy, accent){
  const pct   = rankBy==='core' ? s.cp : s.p;
  const total = rankBy==='core' ? s.ct : s.t;
  const max   = rankBy==='core' ? s.cm : s.mt;
  const delay = Math.min(rank * 0.04, 0.5);
  const rl    = rankLabel(rank, s._isDup);
  const dupStyle = s._isDup ? 'color:#fb923c;' : '';

  let statsHtml = '';
  if(mode === 'medium' || mode === 'full'){
    statsHtml += `<div class="card-stat"><div class="card-stat-lbl">النسبة</div><div class="card-stat-val" style="color:${pct>=90?'#22c55e':pct>=75?'#3b82f6':'#f59e0b'}">${pct}%</div></div>`;
  }
  if(mode === 'full'){
    statsHtml += `<div class="card-stat"><div class="card-stat-lbl">المجموع</div><div class="card-stat-val">${total}<span style="font-size:.7rem;opacity:.6">/${max}</span></div></div>`;
  }

  return `<div class="honor-card" style="--card-accent:${accent};animation-delay:${delay}s">
    <div class="card-rank ${rankClass(rank)}" style="font-size:.6rem;font-weight:900;width:auto;min-width:36px;padding:0 6px;border-radius:12px;${dupStyle}">${rank<=3?medal(rank):rank}</div>
    <div style="font-size:.68rem;font-weight:900;color:${accent};margin-bottom:4px;margin-left:44px;${dupStyle}">${rl}</div>
    <div class="card-name">${s.n}</div>
    <div class="card-class">${s.cl} — ${s.g}</div>
    ${statsHtml ? `<div class="card-stats">${statsHtml}</div>` : ''}
  </div>`;
}

// ===== SAVE AS IMAGE =====
function saveImage(){
  const area = document.getElementById('resultsArea');
  if(area.querySelector('.empty-state')){
    alert('اضغط "عرض" أولاً لإنشاء البيانات');
    return;
  }

  // Use html2canvas via CDN
  if(typeof html2canvas === 'undefined'){
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload = () => captureImage();
    document.head.appendChild(s);
  } else {
    captureImage();
  }
}

function captureImage(){
  const area = document.getElementById('resultsArea');
  html2canvas(area, {
    backgroundColor: '#080e1a',
    scale: 2,
    useCORS: true,
    logging: false
  }).then(canvas => {
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = 'أوائل_المدرسة.png';
    a.click();
  });
}
